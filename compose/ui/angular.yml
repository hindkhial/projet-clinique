services:
  angular-ui:
    build: ../../ui-angular
    container_name: angular21-ui-dev
    ports:
      - "4200:4200"
    volumes:
      - ./ui-angular:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
    networks:
      - microservices-network



