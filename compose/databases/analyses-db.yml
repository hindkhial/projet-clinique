services:
  analyses-db:
    image: postgres:15-alpine
    container_name: analyses-db
    environment:
      POSTGRES_DB: analysesdb
      POSTGRES_USER: analysesuser
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in your local environment}
    ports:
      - "5439:5432"
    volumes:
      - analyses-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analysesuser -d analysesdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  analyses-data:

