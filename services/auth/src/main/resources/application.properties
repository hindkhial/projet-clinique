spring.application.name=auth
server.port=9095

# ============================================
# Keycloak Configuration
# ============================================
keycloak.url=${KEYCLOAK_URL:http://localhost:9089}
keycloak.realm=${KEYCLOAK_REALM:hospital-realm}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:auth-service-client}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.url}/realms/${keycloak.realm}/protocol/openid-connect/certs

# ============================================
# Microservices URLs
# ============================================
patient.service.url=${PATIENT_SERVICE_URL:http://localhost:9090}
staff.service.url=${STAFF_SERVICE_URL:http://localhost:9091}

# ============================================
# OpenFeign Configuration
# ============================================
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000
feign.client.config.default.logger-level=full

# ============================================
# Logging Configuration
# ============================================
logging.level.root=INFO
logging.level.com.ehei.auth=DEBUG
logging.level.org.keycloak=DEBUG
logging.level.feign=DEBUG

# ============================================
# Jackson Configuration (JSON)
# ============================================
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# ============================================
# Error Handling
# ============================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ============================================
# Actuator (pour healthcheck Docker)
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


spring.datasource.url=jdbc:postgresql://localhost:5440/authdb
spring.datasource.username=authuser
spring.datasource.password=${DEMO_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true