syntax = "proto3";

package consultation.events;

option java_package = "consultation.events";
option java_multiple_files = true;

message ConsultationCreatedEvent {
  int64  id               = 1;
  int64  idPatient        = 2;
  optional int64  idMedecin       = 3;
  optional int64  idRdv           = 4;
  string dateConsultation = 5;
  string observation      = 6;
  string traitement       = 7;
  string type             = 8;
  optional string idRadio         = 9;
  optional int64  idAnalyse       = 10;
  optional string typeMaladie     = 11;
}
