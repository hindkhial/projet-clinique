spring.application.name=patient
server.port=9090

spring.datasource.url=jdbc:postgresql://localhost:5432/patientdb
spring.datasource.username=patientuser
spring.datasource.password=${DEMO_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ? Kafka config directement ici, pas besoin de KafkaProducerConfig.java
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9097}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

