spring.application.name=patient
server.port=9090

spring.datasource.url=jdbc:postgresql://localhost:5432/patientdb
spring.datasource.username=patientuser
spring.datasource.password=${DEMO_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuration Kafka
spring.kafka.bootstrap-servers=localhost:9097
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer