spring.application.name=rapport
server.port=9094

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/rapportdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rapportuser}
spring.datasource.password=${DEMO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

