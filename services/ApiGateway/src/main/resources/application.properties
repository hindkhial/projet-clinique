spring.application.name=api-gateway
server.port=9222

# ============================================
# Keycloak JWT Validation
# ============================================

#if docker
#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/hospital-realm/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9089/realms/hospital-realm/protocol/openid-connect/certs

# ============================================
# Routes
# ============================================
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:9095}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=patient-service
spring.cloud.gateway.server.webflux.routes[1].uri=${PATIENT_SERVICE_URL:http://localhost:9090}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/patient/**

spring.cloud.gateway.server.webflux.routes[2].id=staff-service
spring.cloud.gateway.server.webflux.routes[2].uri=${STAFF_SERVICE_URL:http://localhost:9091}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/staff/**,/medecin/**

spring.cloud.gateway.server.webflux.routes[3].id=consultation-service
spring.cloud.gateway.server.webflux.routes[3].uri=${CONSULTATION_SERVICE_URL:http://localhost:9093}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/consultation/**

spring.cloud.gateway.server.webflux.routes[4].id=rdv-service
spring.cloud.gateway.server.webflux.routes[4].uri=${RDV_SERVICE_URL:http://localhost:9092}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/rdv/**

spring.cloud.gateway.server.webflux.routes[5].id=rapport-service
spring.cloud.gateway.server.webflux.routes[5].uri=${RAPPORT_SERVICE_URL:http://localhost:9094}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/rapport/**

spring.cloud.gateway.server.webflux.routes[6].id=radio-service
spring.cloud.gateway.server.webflux.routes[6].uri=${RADIO_SERVICE_URL:http://localhost:9100}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/Radio/**

# ============================================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE