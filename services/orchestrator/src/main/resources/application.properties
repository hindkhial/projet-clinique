spring.application.name=orchestrator
server.port=9099

# Feign Clients URLs
patient.service.url=${PATIENT_SERVICE_URL:http://localhost:9090}
staff.service.url=${STAFF_SERVICE_URL:http://localhost:9091}

# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9097}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.properties.max.request.size=10485760

spring.kafka.consumer.group-id=orchestrator-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
