# Application Name
spring.application.name=radio
server.port=9100

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/radiodb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:radiouser}
spring.datasource.password=${DEMO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


minio.url=${MINIO_URL:http://localhost:9088}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=radio-bucket
minio.heatmap-bucket-name=heatmap-bucket


spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9097}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.consumer.group-id=radio-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer