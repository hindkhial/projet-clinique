<div class="mb-3">

  <input
    type="text"
    class="form-control"
    placeholder="Rechercher par nom ou email..."
    [value]="searchTerm()"
    (input)="searchTerm.set($any($event.target).value)"
  />

  <!-- Spinner pendant le chargement -->
  @if (patientsResource.isLoading()) {
    <div class="mt-2 d-flex align-items-center gap-2 text-secondary">
      <span class="spinner-border spinner-border-sm"></span>
      <span>Recherche...</span>
    </div>
  }

  <!-- Erreur réseau -->
  @if (patientsResource.error()) {
    <div class="alert alert-danger mt-2">
      Erreur lors de la recherche.
    </div>
  }

  <!-- Liste des résultats -->
  @if ((patientsResource.value() ?? []).length > 0) {
    <ul class="list-group mt-2">
      @for (patient of patientsResource.value()!; track patient.id) {
        <button
          type="button"
          class="list-group-item list-group-item-action d-flex justify-content-between"
          (click)="select(patient)"
        >
          <span class="fw-semibold">{{ patient.nom }} {{ patient.prenom }}</span>
          <span class="text-muted">{{ patient.email }}</span>
        </button>
      }
    </ul>
  }

</div>
