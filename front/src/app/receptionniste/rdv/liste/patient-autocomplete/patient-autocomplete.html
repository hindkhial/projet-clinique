<div class="position-relative">

  <input
    type="text"
    class="form-control"
    placeholder="Rechercher par nom, prénom ou email..."
    [class.is-invalid]="invalid()"
    [value]="selectedId() ? selectedLabel() : searchTerm()"
    (click)="onInputClick()"
    (input)="onInput($any($event.target).value)"
    (blur)="onBlur()"
  />
  <div class="invalid-feedback">Patient obligatoire.</div>

  @if (isOpen() && filteredPatients().length > 0) {
    <ul class="list-group position-absolute w-100 shadow-sm"
        style="z-index: 1055; max-height: 200px; overflow-y: auto;">
      @for (p of filteredPatients(); track p.id) {
        <li class="list-group-item list-group-item-action"
            style="cursor: pointer;"
            (mousedown)="select(p)">
          <span class="fw-semibold">{{ p.nom }} {{ p.prenom }}</span>
          <span class="text-muted small ms-2">{{ p.email }}</span>
        </li>
      }
    </ul>
  }

  @if (isOpen() && filteredPatients().length === 0) {
    <ul class="list-group position-absolute w-100 shadow-sm" style="z-index: 1055;">
      <li class="list-group-item text-muted small">Aucun patient trouvé.</li>
    </ul>
  }

</div>
