services:
  # PostgreSQL for Patient Service
  patient-db:
    image: postgres:15-alpine
    container_name: patient-db
    environment:
      POSTGRES_DB: patientdb
      POSTGRES_USER: patientuser
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in your local environment}
    ports:
      - "5432:5432"
    volumes:
      - patient-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patientuser -d patientdb"]
      interval: 10s
      timeout: 5s
      retries: 5


  # patient Service
  patient-service:
    build: ./services/patient
    container_name: patient-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-db:5432/patientdb
      SPRING_DATASOURCE_USERNAME: patientuser
      SPRING_DATASOURCE_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in your local environment}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "9090:9090"
    depends_on:
      patient-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - microservices-network

  #  # PostgreSQL for Staff Service
  staff-db:
    image: postgres:15-alpine
    container_name: staff-db
    environment:
      POSTGRES_DB: staffdb
      POSTGRES_USER: staffuser
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in your local environment}
    ports:
      - "5433:5432"
    volumes:
      - staff-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffuser -d staffdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # staff Service
  staff-service:
    build: ./services/staff
    container_name: staff-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://staff-db:5432/staffdb
      SPRING_DATASOURCE_USERNAME: staffuser
      SPRING_DATASOURCE_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in your local environment}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.ByteArraySerializer
      SPRING_KAFKA_PRODUCER_ACKS: all
      SPRING_KAFKA_PRODUCER_RETRIES: 3

    ports:
      - "9091:9091"
    depends_on:
      staff-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - microservices-network

  #  # PostgreSQL for rdv Service
  rdv-db:
    image: postgres:15-alpine
    container_name: rdv-db
    environment:
      POSTGRES_DB: rdvdb
      POSTGRES_USER: rdvuser
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in your local environment}
    ports:
      - "5434:5432"
    volumes:
      - rdv-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdvuser -d rdvdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # rdv Service
  rdv-service:
    build: ./services/rdv
    container_name: rdv-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://rdv-db:5432/rdvdb
      SPRING_DATASOURCE_USERNAME: rdvuser
      SPRING_DATASOURCE_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in your local environment}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "9092:9092"
    depends_on:
      rdv-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - microservices-network

  #  # PostgreSQL for consultation Service
  consultation-db:
    image: postgres:15-alpine
    container_name: consultation-db
    environment:
      POSTGRES_DB: consultationdb
      POSTGRES_USER: consultationuser
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in your local environment}
    ports:
      - "5435:5432"
    volumes:
      - consultation-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consultationuser -d consultationdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # consultation Service
  consultation-service:
    build: ./services/consultation
    container_name: consultation-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://consultation-db:5432/consultationdb
      SPRING_DATASOURCE_USERNAME: consultationuser
      SPRING_DATASOURCE_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in your local environment}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "9093:9093"
    depends_on:
      consultation-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - microservices-network

  ####
  # PostgreSQL for rapport Service
  rapport-db:
    image: postgres:15-alpine
    container_name: rapport-db
    environment:
      POSTGRES_DB: rapportdb
      POSTGRES_USER: rapportuser
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in your local environment}
    ports:
      - "5436:5432"
    volumes:
      - rapport-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U rapportuser -d rapportdb" ]
      interval: 10s
      timeout: 5s
      retries: 5


  # rapport Service
  rapport-service:
    build: ./services/rapport
    container_name: rapport-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://rapport-db:5432/rapportdb
      SPRING_DATASOURCE_USERNAME: rapportuser
      SPRING_DATASOURCE_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in your local environment}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in your local environment}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in your local environment}
      MINIO_BUCKET_NAME: rapport-bucket
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "9094:9094"
    depends_on:
      rapport-db:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - microservices-network



  # PostgreSQL for keycloak
  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloakdb
      POSTGRES_USER: keycloakuser
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in your local environment}
    ports:
      - "5438:5432"
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5



  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloakdb
      KC_DB_USERNAME: keycloakuser
      KC_DB_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in your local environment}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in your local environment}
      KC_HEALTH_ENABLED: true
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
    ports:
      - "9089:8080"
    depends_on:
      keycloak-db:
        condition: service_started
    networks:
      - microservices-network
    restart: on-failure




  # auth Service
  auth-service:
    build: ./services/auth
    container_name: auth-service
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: hospital-realm
      KEYCLOAK_CLIENT_ID: auth-service-client
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in your local environment}
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in your local environment}
      PATIENT_SERVICE_URL: http://patient-service:9090
      STAFF_SERVICE_URL: http://staff-service:9091
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "9095:9095"
    depends_on:
      keycloak:
        condition: service_started
      patient-service:
        condition: service_started
      staff-service:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - microservices-network

  notification-service:
    build: ./services/notification
    container_name: notification-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "9096:9096"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - microservices-network

  analyses-db:
    image: postgres:15-alpine
    container_name: analyses-db
    environment:
      POSTGRES_DB: analysesdb
      POSTGRES_USER: analysesuser
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in your local environment}
    ports:
      - "5439:5432"
    volumes:
      - analyses-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patientuser -d patientdb"]
      interval: 10s
      timeout: 5s
      retries: 5

#skip 9097 et 9098 pour kafka

  # analyses Service
  analyses-service:
    build: ./services/analyses
    container_name: analyses-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://analyses-db:5432/analysesdb
      SPRING_DATASOURCE_USERNAME: analysesuser
      SPRING_DATASOURCE_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in your local environment}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "9099:9099"
    depends_on:
      analyses-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - microservices-network

  ####
  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in your local environment}
    ports:
      - "9088:9000"      # API
      - "9086:9001"      # MinIO Console - Web UI
    volumes:
      - minio-data:/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9097:9097"      # External access
      - "9098:9092"      # Internal access (mapped to host)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9097
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Kafka UI (Optional - for monitoring)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9087:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: clinique-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - microservices-network

  angular-ui:
    build: ./ui-angular
    ports:
      - "4200:4200"
    volumes:
      - ./ui-angular:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
    container_name: angular21-ui-dev

#
#  # API Gateway
#  api-gateway:
#    build: ./services/api-gateway
#    container_name: api-gateway
#    environment:
#      # Use Docker network service names
#      PRODUCT_SERVICE_URL: http://product-service:8081
#      CLIENT_SERVICE_URL: http://client-service:8084
#    ports:
#      - "8080:8080"
#    depends_on:
#      - product-service
#      - client-service
#    networks:
#      - microservices-network

  # PostgreSQL for Radio Service
  radio-db:
    image: postgres:15-alpine
    container_name: radio-db
    environment:
      POSTGRES_DB: radiodb
      POSTGRES_USER: radiouser
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in your local environment}
    ports:
      - "5437:5432"
    volumes:
      - radio-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiouser -d radiodb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Radio Service
  radio-service:
    build: ./services/radio
    container_name: radio-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://radio-db:5432/radiodb
      SPRING_DATASOURCE_USERNAME: radiouser
      SPRING_DATASOURCE_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in your local environment}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in your local environment}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in your local environment}
      MINIO_BUCKET_NAME: radio-bucket
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.ByteArraySerializer
      SPRING_KAFKA_PRODUCER_ACKS: all
      SPRING_KAFKA_PRODUCER_RETRIES: 3


    ports:
      - "9100:9100"
    depends_on:
      radio-db:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - microservices-network


volumes:
  patient-data:
  staff-data:
  rdv-data:
  consultation-data:
  rapport-data:
  analyses-data:
  keycloak-data:
  minio-data:
  radio-data:

networks:
  microservices-network:
    driver: bridge